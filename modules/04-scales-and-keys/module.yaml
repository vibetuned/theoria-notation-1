# All fifteen keys as exercises, majors and the three minor forms.
exercises:
  # graded sheets of three major scales (21 notes each), easy keys first
  - type: scale-steps
    items: 3
    params: { tonics: [C, G, F] }
  - type: scale-steps
    items: 3
    params: { tonics: [D, B-, A] }
  - type: scale-steps
    items: 3
    params: { tonics: [E-, E, A-] }
  - type: scale-steps
    items: 3
    params: { tonics: [B, D-, F#] }
  - type: scale-steps
    items: 3
    params: { tonics: [G-, C#, C-] }
  # one minor key per sheet, all three forms (21 notes)
  - type: minor-scale-steps
    items: 1
    params: { tonics: [a] }
  - type: minor-scale-steps
    items: 1
    params: { tonics: [e] }
  - type: minor-scale-steps
    items: 1
    params: { tonics: [d] }
  - type: minor-scale-steps
    items: 1
    params: { tonics: [g] }
