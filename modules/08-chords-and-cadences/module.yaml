# One of the course's three exercise-bearing modules (04, 08, 09): the
# drill draws its chords from the book's own cadence figures.
exercises:
  # the four cadences, one bass note missing in each pair
  - type: cadence-bass
    key: C
    items: 4
    seeds: [1, 2]
  - type: cadence-bass
    key: G
    items: 4
    seeds: [1]
  - type: cadence-bass
    key: F
    items: 4
    seeds: [1]
